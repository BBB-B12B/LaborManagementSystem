name: Build and Deploy to Firebase

on:
  push:
    branches:
      - main # หรือปรับเป็น branch หลักที่คุณใช้งาน (เช่น master, develop)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. ติดตั้ง Dependencies และ Build ส่วนของ Cloud Functions (Backend)
      - name: Install and Build Functions
        run: |
          npm --prefix functions install
          npm --prefix functions run build

      # 2. ติดตั้ง Dependencies และ Build Frontend (Next.js static export → frontend/out/)
      - name: Install and Build Frontend
        run: |
          npm --prefix frontend install --legacy-peer-deps
          npm --prefix frontend run build

      # 3. Deploy ไปยัง Firebase (Hosting จาก frontend/out/, Functions, Rules)
      # NOTE: deploy functions BY NAME so a full `deploy` does not try to prune
      # any project-only function that has no source in this repo. All 9 functions
      # defined in functions/src are listed here: 6 gen-2 (us-central1) + 3 gen-1
      # (asia-southeast1: projectSync, dailyContractorSync, dailyContractorReconcile).
      # The 3 gen-1 were previously deployed manually; they are now in CI so a push
      # deploys everything. When adding a new function, add its name to this list.
      - name: Deploy to Firebase
        run: >
          npx firebase-tools deploy --only
          "hosting,firestore,functions:onScanDataChanged,functions:onEmployeeChanged,functions:scheduledAbsenceCheck,functions:onWagePeriodApproved,functions:webhookTimesheetChanged,functions:onReconciliationChanged,functions:projectSync,functions:dailyContractorSync,functions:dailyContractorReconcile"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
